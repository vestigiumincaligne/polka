# nfpm config: deb and rpm from a single spec.
# Build: nfpm package -f packaging/nfpm.yaml -p deb|rpm -t dist/
name: polka
arch: ${PKG_ARCH}
platform: linux
version: ${VERSION}
maintainer: pposevalnikov <noreply@github.com>
description: |
  Polka — a home library for e-books.
  Desktop app and server: catalog, online reading,
  lists, ratings, OPDS for mobile reader apps.
homepage: https://github.com/pposevalnikov/polka
license: MIT

contents:
  - src: ./bin/polka-desktop
    dst: /usr/bin/polka-desktop
  - src: ./bin/polka
    dst: /usr/bin/polka
  - src: ./packaging/polka.desktop
    dst: /usr/share/applications/polka.desktop
  - src: ./web/public/icons/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/polka.png
