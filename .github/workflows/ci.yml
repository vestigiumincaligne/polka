name: CI

on:
  push:
    branches: [main]
  pull_request:

# nodynamic: JPEG XL covers decode via the pure-Go wazero backend (no
# purego/CGO), keeping the build CGO-free on every target.
env:
  GOFLAGS: -tags=nodynamic

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Test frontend
        run: cd web && npm test

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o bin/polka ./cmd/polka
